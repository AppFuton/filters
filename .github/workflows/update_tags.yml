name: Weekly Tag Extraction

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Extraction Script
        run: |
          cd scripts
          kotlinc -script extract_tags.main.kts

      - name: Create Pull Request on Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.AUTOMATION_PAT }}
          commit-message: "chrono: automatically update parsed tags registry"
          branch: automation/update-extracted-tags
          delete-branch: true
          title: "🤖 Automation: Update extracted tags registry"
          body: |
            This is an automated weekly update generated by the Tag Extraction workflow.
            
            New unique metadata categories or genres have been fetched from the upstream parser repository and compiled into `data/tags.json`. Please review the diff mutations before merging.
          base: main